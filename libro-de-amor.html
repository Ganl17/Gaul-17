<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para el Amor de mi Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    repeating-linear-gradient(90deg,rgba(255,40,60,.05) 0 2px,transparent 2px 90px),
    radial-gradient(ellipse at 50% -10%,#6a1120 0%,#2a0810 45%,#0b0206 100%);
  background-attachment:fixed;
  color:#5a1f2d;font-family:'Lora',Georgia,'Times New Roman',serif;
  overflow:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.stage{
  --w:min(88vw,420px);
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:max(14px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom));
}
@supports (height:100dvh){.stage{--w:min(88vw,calc((100dvh - 120px) / 1.5),420px)}}

.book{
  position:relative;width:var(--w);height:calc(var(--w) * 1.5);
  perspective:2200px;
  transition:transform .9s cubic-bezier(.45,.05,.25,1);
  font-size:calc(var(--w) * .04);
}
.book::after{ /* grosor de las hojas */
  content:'';position:absolute;right:calc(var(--w) * -.04);top:calc(var(--w) * .012);bottom:calc(var(--w) * -.012);
  width:calc(var(--w) * .07);border-radius:0 10px 10px 0;
  background:linear-gradient(90deg,#e7909b,#d9707e);box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:-1;
}
@media (min-width:900px){.book.open{transform:translateX(50%)}}

.leaf{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.45,.05,.25,1),opacity .35s ease;
}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.gone{opacity:0;pointer-events:none}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:5px 12px 12px 5px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.front{
  background:
    radial-gradient(circle at 85% 90%,rgba(244,180,190,.35),transparent 45%),
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.9),transparent 50%),
    linear-gradient(160deg,#fff7f5,#fbe6e6);
  padding:calc(var(--w) * .07) calc(var(--w) * .07) calc(var(--w) * .06) calc(var(--w) * .13);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.back{
  transform:rotateY(180deg);
  background:linear-gradient(160deg,#f7b9c2,#ee98a5);
  border-radius:12px 5px 5px 12px;
}
.back::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.12) 0 1px,transparent 1px 22px)}
.front::before,.back::before{ /* lomo rojo y blanco */
  content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--w) * .055);z-index:2;
  background:repeating-linear-gradient(180deg,#c4283c 0 calc(var(--w) * .022),#fdeeee calc(var(--w) * .022) calc(var(--w) * .04));
  box-shadow:2px 0 6px rgba(120,20,40,.25);
}
.front::after{ /* sombra del pliegue */
  content:'';position:absolute;left:calc(var(--w) * .055);top:0;bottom:0;width:calc(var(--w) * .07);
  background:linear-gradient(90deg,rgba(150,50,70,.14),transparent);pointer-events:none;
}
.deco{position:absolute;left:calc(var(--w) * .075);top:calc(var(--w) * .01);width:calc(var(--w) * .3);height:calc(var(--w) * .3);pointer-events:none;opacity:.9}

.title{
  flex:none;  font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive;font-weight:700;
  font-size:calc(var(--w) * .105);line-height:1.1;color:#8a2440;margin-top:calc(var(--w) * .1);
}
.txt{flex:none;margin-top:.8em;font-size:1em;line-height:1.65;color:#6b3340;max-width:30ch;font-weight:500}
.heart{color:#d8344f;margin-top:.5em;font-size:1.1em}
.photo-wrap{flex:1 1 0;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding:.7em 0 .5em}
.polaroid{
  width:92%;background:#fff;padding:calc(var(--w) * .018) calc(var(--w) * .018) 0;border-radius:5px;
  box-shadow:0 6px 18px rgba(120,40,60,.28);
}
.polaroid .ph{width:100%;aspect-ratio:1.15/1;object-fit:cover;display:block;border-radius:2px}
.photo-wrap .polaroid{height:100%;max-height:calc(var(--w) * .78);display:flex;flex-direction:column}
.photo-wrap .polaroid .ph{flex:1 1 0;min-height:0;aspect-ratio:auto;height:0}
.photo-wrap .polaroid figcaption{flex:none}
.polaroid figcaption{
  font-family:'Dancing Script','Segoe Script',cursive;font-size:1.35em;color:#8a2440;
  padding:.25em 0 .3em;line-height:1.2;
}
.nav{flex:none;width:100%;display:flex;justify-content:space-between;align-items:center;min-height:calc(var(--w) * .1)}
.btn{
  font-family:'Lora',Georgia,serif;font-size:.95em;font-weight:500;color:#fff;cursor:pointer;
  background:linear-gradient(#d4324a,#b8213a);border:0;border-radius:999px;
  padding:.55em 1.2em;box-shadow:0 4px 10px rgba(160,30,55,.35);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(160,30,55,.45)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.music:focus-visible{outline:3px solid #ffd3da;outline-offset:3px}

/* Página de la promesa */
.big-heart{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.big-heart svg{width:46%;filter:drop-shadow(0 8px 14px rgba(180,30,60,.4));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}60%{transform:scale(1)}}

/* Collage final */
.collage{flex:1 1 0;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.9em;align-content:center;padding:.6em .2em}
.collage .polaroid{width:100%;padding:calc(var(--w) * .012);box-shadow:0 4px 12px rgba(120,40,60,.25)}
.collage .polaroid:nth-child(1){transform:rotate(-3deg)}
.collage .polaroid:nth-child(2){transform:rotate(2.5deg) translateY(.5em)}
.collage .polaroid:nth-child(3){transform:rotate(2deg)}
.collage .polaroid:nth-child(4){transform:rotate(-2.5deg) translateY(-.3em)}
.collage .ph{aspect-ratio:1/1}
.collage{grid-template-rows:auto auto}

.dots{display:flex;gap:9px;height:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,200,208,.3);transition:all .3s ease}
.dots i.on{background:#ff8fa3;transform:scale(1.35)}

.music{
  position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,180,190,.4);background:rgba(60,8,20,.65);color:#ffc2cc;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
.music.on{background:#c4283c;color:#fff;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,100,120,.5)}50%{box-shadow:0 0 0 10px rgba(255,100,120,0)}}
.toast{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:6;
  background:rgba(40,5,14,.92);color:#ffd9de;font-size:14px;padding:10px 16px;border-radius:12px;max-width:86vw;text-align:center;
  transition:all .35s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .leaf,.book{transition-duration:.01s}
  .big-heart svg,.music.on{animation:none}
}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="0 0 40 40">
      <g transform="translate(20 20)">
        <g fill="#f3a9b6"><ellipse cx="0" cy="-9" rx="6.5" ry="9"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(72)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(144)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(216)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(288)"/></g>
        <circle r="3.2" fill="#d9566f"/>
      </g>
    </symbol>
    <symbol id="sakura" viewBox="0 0 120 120">
      <path d="M2 14 C30 20 52 34 78 62" fill="none" stroke="#c99aa4" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M30 24 C40 14 52 12 64 14" fill="none" stroke="#c99aa4" stroke-width="1.2" stroke-linecap="round"/>
      <use href="#flower" x="8" y="2" width="30" height="30"/>
      <use href="#flower" x="54" y="2" width="22" height="22" opacity=".85"/>
      <use href="#flower" x="62" y="40" width="26" height="26" opacity=".9"/>
      <use href="#flower" x="34" y="30" width="16" height="16" opacity=".7"/>
    </symbol>
    <symbol id="heartsvg" viewBox="0 0 100 90">
      <path d="M50 86 C14 58 2 40 2 25 C2 11 13 2 26 2 C37 2 46 8 50 17 C54 8 63 2 74 2 C87 2 98 11 98 25 C98 40 86 58 50 86Z" fill="#d8344f"/>
      <path d="M22 16 C14 18 10 26 12 33" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<button class="music" id="music" aria-label="Música" title="Música">♪</button>
<input type="file" id="songPicker" accept="audio/*" hidden>
<div class="toast" id="toast" role="status"></div>

<main class="stage" id="stage">
  <div class="book" id="book" aria-live="polite"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
</main>

const PAGES = [
  { type:"cover", title:"Para el Amor de mi Vida",
    text:"He creado esta pequeña historia para recordarte cuánto te amo mi pedorris…",
    img:IMG.leaves, pos:"50% 15%", cap:"Tú y yo", btn:"Abrir →" },

  { type:"photo", title:"Nuestro Comienzo ✨",
    text:"Cada día que pasa, mi amor por ti crece. Eres la casualidad más bonita que me ha pasado.",
    img:IMG.rest, pos:"50% 40%", cap:"Un día juntos" },

  { type:"photo", title:"Lo que Amo de Ti 🥰",
    text:"Amo tu sonrisa, tu forma de mirar y la calma que me das. Haces que mi mundo sea un lugar mejor solo con existir.",
    img:IMG.stadium, pos:"50% 25%", cap:"Un día inolvidable" },

  { type:"photo", title:"Eres mi Todo 💖",
    text:"Contigo, los días comunes se convierten en recuerdos que quiero guardar para siempre.",
    img:IMG.vest, pos:"50% 10%", cap:"Siempre a tu lado" },

  { type:"heart", title:"Mi Promesa 🤍",
    text:"Prometo seguir eligiéndote cada día, cuidarte, hacerte reír y construir contigo todo lo que soñemos." },

  { type:"end", title:"Te Amo ❤️",
    text:"Gracias por cada momento. Esto es solo una parte de nuestra historia, y lo mejor aún está por venir.",
    imgs:[[IMG.leaves,"50% 15%"],[IMG.rest,"50% 40%"],[IMG.stadium,"50% 25%"],[IMG.vest,"50% 10%"]] }
];
/* ===================================================================== */

const book = document.getElementById('book');
const dotsEl = document.getElementById('dots');
const N = PAGES.length;
const DUR = 900;
let idx = 0;           // cantidad de hojas volteadas
const leaves = [], timers = [], busy = [];

const flower = `<svg class="deco" viewBox="0 0 120 120" aria-hidden="true"><use href="#sakura"/></svg>`;
const polaroid = (src,pos,cap) =>
  `<figure class="polaroid"><img class="ph" src="${src}" style="object-position:${pos}" alt="${cap||'Foto de nosotros'}">${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
const nav = (prev,nextLabel,nextGo) =>
  `<div class="nav">${prev?`<button class="btn" data-go="prev">← Anterior</button>`:'<span></span>'}<button class="btn" data-go="${nextGo}">${nextLabel}</button></div>`;

function pageHTML(p,i){
  const head = `${flower}<h1 class="title">${p.title}</h1><p class="txt">${p.text}</p>`;
  if(p.type==='cover')
    return `${head}<div class="heart" aria-hidden="true">❤</div><div class="photo-wrap">${polaroid(p.img,p.pos,p.cap)}</div>${nav(false,p.btn,'next')}`;
  if(p.type==='photo')
    return `${head}<div class="photo-wrap">${polaroid(p.img,p.pos,p.cap)}</div>${nav(true,'Siguiente →','next')}`;
  if(p.type==='heart')
    return `${head}<div class="big-heart"><svg viewBox="0 0 100 90" aria-hidden="true"><use href="#heartsvg"/></svg></div>${nav(true,'Siguiente →','next')}`;
  return `${head}<div class="collage">${p.imgs.map(([s,pos])=>`<figure class="polaroid"><img class="ph" src="${s}" style="object-position:${pos}" alt="Recuerdo"></figure>`).join('')}</div>${nav(true,'Volver a empezar','restart')}`;
}

PAGES.forEach((p,i)=>{
  const leaf = document.createElement('section');
  leaf.className = 'leaf';
  leaf.style.zIndex = N - i;
  leaf.innerHTML = `<div class="face front">${pageHTML(p,i)}</div><div class="face back"></div>`;
  book.appendChild(leaf);
  leaves.push(leaf);
  const d = document.createElement('i'); dotsEl.appendChild(d);
});

const wide = () => window.matchMedia('(min-width:900px)').matches;

function refresh(){
  book.classList.toggle('open', idx>0);
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
  leaves.forEach((l,i)=>{
    const flipped = i<idx;
    const hide = flipped && !busy[i] && (!wide() || i<idx-1);
    l.classList.toggle('gone',hide);
    l.setAttribute('aria-hidden', flipped ? 'true':'false');
    l.querySelectorAll('button').forEach(b=>b.tabIndex = (i===idx)?0:-1);
  });
}

function setLeaf(i,flipped){
  const l = leaves[i];
  busy[i]=true; l.style.zIndex=100; l.classList.remove('gone');
  l.classList.toggle('flipped',flipped);
  clearTimeout(timers[i]);
  timers[i]=setTimeout(()=>{
    busy[i]=false;
    l.style.zIndex = flipped ? i+1 : N-i;
    refresh();
  },DUR);
}

function next(){ if(idx<N-1){ setLeaf(idx,true); idx++; refresh(); tryMusicOnOpen(); } }
function prev(){ if(idx>0){ idx--; setLeaf(idx,false); refresh(); } }
function restart(){
  const back = idx;
  for(let k=0;k<back;k++){
    setTimeout(()=>{ if(idx>0){ idx--; setLeaf(idx,false); refresh(); } }, k*140);
  }
}

book.addEventListener('click',e=>{
  const b = e.target.closest('[data-go]'); if(!b) return;
  ({next,prev,restart})[b.dataset.go]();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});
let sx=null;
document.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(dx<-50) next(); else if(dx>50) prev();
},{passive:true});
window.addEventListener('resize',refresh);
refresh();

/* ---------- Música ----------
   Opción 1: guarda una canción junto a este archivo con el nombre  musica.mp3
   Opción 2: toca el botón ♪ y elige una canción de tu dispositivo.            */
const musicBtn = document.getElementById('music');
const picker = document.getElementById('songPicker');
const toastEl = document.getElementById('toast');
const audio = new Audio('musica.mp3');
audio.loop = true; audio.preload = 'auto';
let userPicked = false, toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3200); }
audio.addEventListener('play',()=>musicBtn.classList.add('on'));
audio.addEventListener('pause',()=>musicBtn.classList.remove('on'));
function tryMusicOnOpen(){ if(idx===1 && audio.paused && !userPicked){ audio.play().catch(()=>{}); } }
musicBtn.addEventListener('click',()=>{
  if(!audio.paused){ audio.pause(); return; }
  audio.play().catch(()=>{ toast('Elige la canción que quieres escuchar'); picker.click(); });
});
picker.addEventListener('change',()=>{
  const f = picker.files[0]; if(!f) return;
  userPicked = true; audio.src = URL.createObjectURL(f);
  audio.play().catch(()=>toast('No se pudo reproducir ese archivo'));
});

/* ---------- Partículas de fondo ---------- */
(function(){
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,P=[];
  function size(){ const r=devicePixelRatio||1; W=cv.width=innerWidth*r; H=cv.height=innerHeight*r; P=Array.from({length:Math.round(innerWidth/9)+30},()=>mk(true,r)); }
  function mk(init,r){ return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:(Math.random()*1.8+.5)*r,v:(Math.random()*.25+.05)*r,dx:(Math.random()-.5)*.15*r,ph:Math.random()*6.28}; }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.y-=p.v; p.x+=p.dx;
      if(p.y<-10){ Object.assign(p,mk(false,devicePixelRatio||1)); }
      const a = .35+.45*Math.sin(t/900+p.ph);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle=`rgba(255,${60+Math.round(a*60)},${80+Math.round(a*40)},${Math.max(.1,a)})`; ctx.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener('resize',size); size(); requestAnimationFrame(draw);
})();
</script>
